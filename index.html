<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Kaygı" />
<title>Kaygı</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root { --bg:#0b1220; --ink:#f7fafc; --muted:#c9d4e3; --line:rgba(247,250,252,.12); --card:#141c2e; --green:#1fa971; --green-d:#14875a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100dvh;
    background:
      radial-gradient(700px 420px at 50% -8%, rgba(31,169,113,.16), transparent 62%),
      var(--bg);
  }
  .app { max-width:480px; margin:0 auto; padding:max(18px, env(safe-area-inset-top)) 18px 32px; }
  header { display:flex; justify-content:space-between; align-items:center; min-height:36px; }
  .brand { font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:650; }
  button, textarea { font-family:inherit; }
  .link { border:0; background:transparent; color:var(--ink); font-size:15px; padding:8px 0; font-weight:600; }
  .stage { height:280px; display:grid; place-items:center; margin-top:6px; }
  .ring {
    width:260px; height:260px; border-radius:50%; display:grid; place-items:center;
    background:radial-gradient(circle, rgba(61,202,160,.22) 0%, rgba(31,169,113,.08) 42%, transparent 70%);
  }
  .orb {
    position:relative; width:180px; height:180px; border-radius:50%;
    background:
      radial-gradient(circle at 32% 26%, rgba(255,255,255,.5), rgba(255,255,255,0) 20%),
      radial-gradient(circle at 70% 80%, rgba(6,36,24,.5), transparent 38%),
      radial-gradient(circle at 48% 46%, #49d0a4 0%, #1fa971 38%, #127a50 68%, #0b4d33 100%);
    transform:scale(var(--s,.78));
    transition:transform 4s cubic-bezier(.45,0,.2,1);
    box-shadow:
      inset 0 -30px 38px rgba(4,28,18,.45),
      inset 16px 18px 24px rgba(255,255,255,.18),
      0 28px 46px rgba(0,0,0,.4),
      0 0 52px rgba(31,169,113,.24);
  }
  .orb:before {
    content:""; position:absolute; inset:8%; border-radius:50%;
    background:radial-gradient(circle at 36% 30%, rgba(255,255,255,.2), transparent 36%);
    pointer-events:none;
  }
  .orb:after {
    content:""; position:absolute; left:20%; top:12%; width:32%; height:15%;
    border-radius:50%; background:rgba(255,255,255,.32); filter:blur(8px);
    pointer-events:none;
  }
  body.inhale { --s:1; } body.hold { --s:1; } body.exhale { --s:.78; }
  body.exhale .orb { transition-duration:8s; }
  .phase { text-align:center; margin:6px 0 18px; min-height:108px; }
  .phase b { display:block; font-size:24px; font-weight:650; letter-spacing:-.02em; }
  .phase span { display:block; margin:8px auto 0; max-width:320px; color:var(--ink); font-size:16px; line-height:1.4; min-height:44px; }
  .count { margin-top:6px; font-variant-numeric:tabular-nums; font-size:32px; font-weight:650; color:var(--green); }
  .go,.soft { width:100%; border:0; border-radius:18px; padding:17px 18px; font-size:17px; font-weight:700; }
  .go { background:var(--green); color:#042216; }
  .go:active { background:var(--green-d); }
  .soft { background:#1a2438; color:var(--ink); border:1px solid var(--line); }
  .row { display:flex; gap:8px; margin-top:10px; } .row > * { flex:1; }
  .card { margin-top:16px; padding:16px; border:1px solid var(--line); border-radius:20px; background:rgba(20,28,46,.9); }
  .card h2 { margin:0 0 10px; font-size:17px; font-weight:650; }
  h1 { font-size:28px; margin:14px 0 8px; font-weight:650; letter-spacing:-.03em; }
  label { display:block; font-size:14px; color:var(--muted); margin:8px 0 6px; }
  textarea { width:100%; border:1px solid var(--line); background:#0b1220; color:var(--ink); border-radius:14px; padding:12px; font-size:16px; min-height:80px; }
  .wrap { overflow-x:auto; margin:0 -4px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { border-bottom:1px solid var(--line); padding:9px 4px; text-align:center; color:var(--ink); }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  th:first-child, td:first-child { text-align:left; min-width:148px; }
  .sum { border-radius:8px; font-weight:700; }
  .note { color:var(--muted); font-size:13px; line-height:1.5; margin-top:14px; }
  .steps { display:flex; gap:6px; margin:20px 0 4px; }
  .steps span { flex:1; height:5px; border-radius:99px; background:#1a2438; }
  .steps span.on { background:var(--green); }
  .big { font-size:72px; font-weight:650; text-align:center; margin:18px 0 0; line-height:1; color:var(--green); letter-spacing:-.04em; }
  .sub { text-align:center; color:var(--ink); margin:10px auto 22px; font-size:16px; line-height:1.45; max-width:320px; }
  .hidden { display:none !important; }
  .modal { position:fixed; inset:0; background:rgba(5,10,18,.7); display:grid; place-items:end center; padding:16px; z-index:5; }
  .sheet { width:min(440px,100%); background:#162033; border:1px solid var(--line); border-radius:22px; padding:18px; }
  .sheet p { line-height:1.5; margin:0 0 14px; font-size:16px; }
</style>
</head>
<body>
  <div class="app">
    <section id="breath">
      <header>
        <span class="brand">Kaygı</span>
        <button class="link" id="toTable" type="button">Tablo</button>
      </header>
      <div class="stage">
        <div class="ring"><div class="orb"></div></div>
      </div>
      <div class="phase">
          <b id="phaseLabel">Hazır mısın?</b>
          <span id="phaseHint">Kontrol sende.</span>
          <div class="count" id="count"></div>
        </div>
      <button class="go" id="startBtn" type="button">Kontrol sende</button>
      <div class="row hidden" id="liveRow">
        <button class="go" id="doneBtn" type="button">Rahatladım</button>
        <button class="soft" id="stopBtn" type="button">Durdur</button>
      </div>
      <section class="card hidden" id="after">
        <h2>Geçti. Bunu başardın.</h2>
        <button class="go" id="noteBtn" type="button">Tabloya not ekle</button>
      </section>
      <button class="soft" id="toGround" type="button" style="margin-top:10px">5-4-3-2-1</button>
    </section>
    <section id="ground" class="hidden">
      <header>
        <button class="link" id="groundBack" type="button">← Nefes</button>
        <span class="brand">Kaygı</span>
      </header>
      <div class="steps" id="stepDots"></div>
      <div class="big" id="gNum">5</div>
      <h1 id="gTitle" style="text-align:center;margin-top:4px">Gör</h1>
      <p class="sub" id="gHint"></p>
      <button class="go" id="gTap" type="button">Bunu saydım</button>
      <button class="soft" id="gSkip" type="button" style="margin-top:10px">Geç</button>
    </section>
    <section id="table" class="hidden">
      <header>
        <button class="link" id="toBreath" type="button">← Nefes</button>
        <span class="brand">Kaygı</span>
      </header>
      <h1>Kaygı takibi</h1>
      <div class="card">
        <label>Bu atak için bir cümle</label>
        <textarea id="journal" placeholder="istersen bir cümle"></textarea>
        <button class="go" id="saveNote" type="button" style="margin-top:10px">Kaydet</button>
        <p class="note" id="saved">Kayıt sadece bu telefonda durur.</p>
      </div>
      <div class="card">
        <div class="wrap"><table id="grid"></table></div>
        <p class="note">Hücreye bas, 0’dan 4’e çıkar. Gün toplamına basınca kısa tavsiye açılır.</p>
      </div>
      <p class="note">Bu bir nefes ve not aracıdır, tedavi değildir. Tehlike hissedersen 112.</p>
    </section>
  </div>
  <div class="modal hidden" id="modal"><div class="sheet"><p id="modalText"></p><button class="go" id="modalClose" type="button">Kapat</button></div></div>
<script>
const SYMPTOMS = ["Kalbin teklemesi, hızlanması veya çarpıntı","Terleme, ürperme veya kızarma","Titreşim veya sarsılma","Nefes daralması, nefes almakta zorlanma","Boğulacakmış gibi hissetme","Göğüste ağrı veya daralma","Karnında kelebekler, mide bulantısı veya huzursuz mide","Baş dönmesi, sersemlik hali, denge yitimi","Kendini veya dünyayı gerçek değilmiş gibi hissetmek","Uyuşma ve karıncalanma"];
const DAYS = ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
const LINES = {
  al:["Burnundan al… vücudun seni koruyor.","Yavaşça nefes al… güvendesin.","Hava içeri giriyor, bedenin rahatlıyor.","Nefes al… enerji doluyor.","Derin nefes… zihnin sakinleşiyor.","İçeri çek, her şey yolunda.","Dikkatini nefesine ver, güven içindesin.","Bedenin uyarıyor, sen kontrolündesin.","Nefes al… her şey geçici.","İçeri çek, panik küçülüyor.","Her nefes seni güçlendiriyor.","Vücudun ritmini buluyor, sen de sakinleşiyorsun.","Derin nefes… bedenin uyanıyor.","Kontrol sende, panik dalgası geçiyor.","Hava doluyor, stres azalıyor."],
  tut:["Her şey yolunda.","Bu his geçici.","Kontrol sende, beden dengede.","Nefesini tut… sabırlı ol.","Dur, hisset ve sakinleş.","Bedenin rahat, zihin huzurlu.","Bir an dur… hislerini izle.","Panik geçiyor, sen güçlüsün.","Sakin ol… nefesini hisset.","Dikkatini topla, beden dengede.","Zihnini gözlemle, her şey normal.","Durakla… kontrol sende.","Sabırlı ol… dalgalar geçici.","Bedenin sana güven veriyor.","Hisset ve kabul et, panik azalıyor."],
  ver:["Ağzından ver… yük azalıyor.","Nefesi bırak… kalbin sakinleşiyor.","Bırak gitsin… dalga sönüyor.","Nefes ver… gevşe ve rahatla.","Dışarı bırak, huzuru hisset.","Bırak gitsin… tüm stres uzaklaşıyor.","Panik dağılıyor, sen güçlüsün.","Stres akıyor, beden hafifliyor.","Rahatla… her nefesle sakinleş.","Yavaşça ver… kontrol sende.","Her nefesle huzur artıyor.","Bırak, bırak… kaygı azalıyor.","Stres uzaklaşıyor, sen güven içindesin.","Nefesini bırak, panik küçülüyor.","Huzur dol… her nefesle gevşe."]
};
const KEY = "kaygi-v5";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { state = {}; }
if (!state.grid) {
  let old = null;
  try { old = JSON.parse(localStorage.getItem("puanlar")); } catch {}
  state.grid = Array.isArray(old) && old.length === 10 ? old : SYMPTOMS.map(() => Array(7).fill(0));
}
if (!state.notes) state.notes = [];
function persist(){ localStorage.setItem(KEY, JSON.stringify(state)); localStorage.setItem("puanlar", JSON.stringify(state.grid)); }
function advice(total){
  if (total<=2) return "Harika! Çok az kaygı belirtisi. Ev içinde kısa yürüyüş yapabilirsin, nefes egzersizine devam et.";
  if (total<=6) return "Birkaç kaygı belirtisi gözlemledin. Nefes egzersizine devam et ve sakin aktiviteler yap.";
  if (total<=10) return "Hafif düzeyde fiziksel kaygı var. Ev içinde kısa yürüyüş iyi gelir. Derin nefes ve farkındalık egzersizleri yap.";
  if (total<=20) return "Orta düzeyde kaygı. Bedenini dinle, nefes egzersizleri ve hafif ev içi egzersizler yap. Kaygı normal, panik geçici.";
  if (total<=30) return "Şiddetli fiziksel kaygı. Yavaşça otur, derin nefes al-ver yap. Ev içi hareketlerle rahatlamayı dene. Her şey geçici. Kalbin hızlı atıyor, bu atakta sık görülen bir tepki.";
  return "Yoğun bir gün. Kendine zaman ayır, sakin bir ortamda dinlen. Nefes ve farkındalık egzersizleri yap. Bu dalga da geçecek.";
}
function color(total){
  if (total<=2) return ["#1fa971","#042216"];
  if (total<=6) return ["#8fd18a","#042216"];
  if (total<=10) return ["#f3e0a2","#1b2433"];
  if (total<=20) return ["#e7b48a","#1b2433"];
  if (total<=30) return ["#e08b7a","#1b2433"];
  return ["#c45b52","#f4f7fb"];
}
function renderGrid(){
  const totals = DAYS.map((_,c)=>state.grid.reduce((a,row)=>a+row[c],0));
  let html = "<tr><th>Belirti</th>"+DAYS.map(d=>`<th>${d}</th>`).join("")+"</tr>";
  SYMPTOMS.forEach((name,r)=>{ html += `<tr><td>${name}</td>`+state.grid[r].map((n,c)=>`<td data-r="${r}" data-c="${c}">${n}</td>`).join("")+"</tr>"; });
  html += "<tr><td>Toplam</td>"+totals.map((n,c)=>{ const [bg,fg]=color(n); return `<td class="sum" data-day="${c}" style="background:${bg};color:${fg}">${n}</td>`; }).join("")+"</tr>";
  document.getElementById("grid").innerHTML = html;
}
document.getElementById("grid").onclick = (e)=>{
  const cell = e.target.closest("[data-r]"), day = e.target.closest("[data-day]");
  if (cell){ state.grid[+cell.dataset.r][+cell.dataset.c] = (state.grid[+cell.dataset.r][+cell.dataset.c]+1)%5; persist(); renderGrid(); }
  else if (day){ document.getElementById("modalText").textContent = advice(state.grid.reduce((a,row)=>a+row[+day.dataset.day],0)); document.getElementById("modal").classList.remove("hidden"); }
};
document.getElementById("modalClose").onclick = ()=>document.getElementById("modal").classList.add("hidden");
function show(which){
  document.getElementById("breath").classList.toggle("hidden", which!=="breath");
  document.getElementById("table").classList.toggle("hidden", which!=="table");
  document.getElementById("ground").classList.toggle("hidden", which!=="ground");
}
document.getElementById("toTable").onclick = ()=>show("table");
document.getElementById("toBreath").onclick = ()=>show("breath");
document.getElementById("noteBtn").onclick = ()=>show("table");
document.getElementById("toGround").onclick = ()=>{ resetGround(); show("ground"); };
document.getElementById("groundBack").onclick = ()=>show("breath");
const GROUND = [
  { n:5, title:"Gör", hint:"Etrafında gördüğün 5 şey. Duvar, telefon, ışık. Sayman yeter." },
  { n:4, title:"Dokun", hint:"Dokunabileceğin 4 şey. Masa, kumaş, telefon, kendi elin." },
  { n:3, title:"Duy", hint:"Duyduğun 3 ses. Klima, dışarı, kendi nefesin. Sessizse nefes sayılır." },
  { n:2, title:"Kokla", hint:"Koku alabildiğin 2 şey. Yoksa burnunu iki kez çekmen yeter." },
  { n:1, title:"Tat", hint:"Ağzındaki tat. Su, diş macunu veya hiçbir şey. Hiçbir şey de cevap." }
];
let gStep = 0, gCount = 0, gDone = false;
function resetGround(){ gStep = 0; gCount = 0; gDone = false; renderGround(); }
function renderGround(){
  if (gDone){
    document.getElementById("gNum").textContent = "";
    document.getElementById("gTitle").textContent = "Buradasın.";
    document.getElementById("gHint").textContent = "Dalga geçiyor. İstediğin anda nefese dön.";
    document.getElementById("gTap").textContent = "Nefese dön";
    document.getElementById("stepDots").innerHTML = GROUND.map(()=>`<span class="on"></span>`).join("");
    return;
  }
  const step = GROUND[gStep];
  document.getElementById("gNum").textContent = step.n - gCount;
  document.getElementById("gTitle").textContent = step.title;
  document.getElementById("gHint").textContent = step.hint;
  document.getElementById("gTap").textContent = "Bunu saydım";
  document.getElementById("stepDots").innerHTML = GROUND.map((_,i)=>`<span class="${i<=gStep?"on":""}"></span>`).join("");
}
document.getElementById("gTap").onclick = ()=>{
  if (gDone){ show("breath"); return; }
  const step = GROUND[gStep];
  gCount++;
  if (gCount >= step.n){
    gStep++;
    gCount = 0;
    if (gStep >= GROUND.length){ gDone = true; }
  }
  renderGround();
};
document.getElementById("gSkip").onclick = ()=>{
  if (gDone){ show("breath"); return; }
  gStep++; gCount = 0;
  if (gStep >= GROUND.length){ gDone = true; }
  renderGround();
};
document.getElementById("saveNote").onclick = ()=>{
  const text = document.getElementById("journal").value.trim();
  if (text) state.notes.push({t:Date.now(), text});
  persist(); document.getElementById("journal").value = "";
  document.getElementById("saved").textContent = text ? "Kaydedildi. Bu telefonda durur." : "Boş not kaydedilmedi.";
};
let running=false, timer=null, last={al:"",tut:"",ver:""};
function pick(kind){ let line=last[kind]; while(line===last[kind]) line=LINES[kind][Math.floor(Math.random()*LINES[kind].length)]; last[kind]=line; return line; }
function setPhase(name,hint,n,cls){ document.body.classList.remove("inhale","hold","exhale"); if(cls) document.body.classList.add(cls); document.getElementById("phaseLabel").textContent=name; document.getElementById("phaseHint").textContent=hint; document.getElementById("count").textContent=n||""; }
function wait(ms){ return new Promise(r=>timer=setTimeout(r,ms)); }
async function cycle(){
  const steps=[["Burnundan nefes al","al",4,"inhale","in"],["Nefesini tut","tut",4,"hold","hold"],["Ağzından yavaşça ver","ver",8,"exhale","out"]];
  while(running) for (const [name,kind,sec,cls,breath] of steps){
    if(!running) return;
    const line = pick(kind);
    for(let n=sec;n>=1 && running;n--){ setPhase(name,line,n,cls); await wait(1000); }
  }
}
document.getElementById("startBtn").onclick = ()=>{
  running = true;
  document.getElementById("startBtn").classList.add("hidden");
  document.getElementById("liveRow").classList.remove("hidden");
  document.getElementById("after").classList.add("hidden");
  cycle();
};
function halt(done){
  running=false; clearTimeout(timer);
  const end=["Sakinledik…","Her zamanki gibi geçti…","Zararsız bir şekilde geçti…"];
  setPhase(done?end[Math.floor(Math.random()*end.length)]:"Hazır mısın?", done?"Geçti. Bunu başardın.":"Kontrol sende.", "", "");
  document.getElementById("startBtn").classList.remove("hidden");
  document.getElementById("liveRow").classList.add("hidden");
  document.getElementById("after").classList.toggle("hidden", !done);
}
document.getElementById("stopBtn").onclick=()=>halt(false);
document.getElementById("doneBtn").onclick=()=>halt(true);
renderGrid();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
